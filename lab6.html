<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        *{
            margin: 0;
            box-sizing: border-box;
        }

        .flex-parent{
            border: 1px solid;
            display: flex;
            align-items: center;
            justify-content: center;
            justify-content: space-around;
            height: 100vh;
            width: 100vw;
        }

    </style>
</head>
<body>
    <div class="flex-parent">
        <div><img src="https://picsum.photos/200/200?random=1" alt="Image 1"></div>
        <div><img src="https://picsum.photos/300/300?random=2" alt="Image 2"></div>
        <div><img src="https://picsum.photos/200/200?random=3" alt="Image 3"></div>
    </div>
</body>
</html>
