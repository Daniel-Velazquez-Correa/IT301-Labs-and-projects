<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Lab 16</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 40px;
            }
            .valid {
                color: green;
            }

            .invalid {
                color: red;
            }
        </style>
    </head>
    <body>
        <form>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password" required>

            <div id="password-rules" hidden>
                <p>Your password must:</p>
                <ul>
                    <li id="length">Be at least 6 characters</li>
                    <li id="special">Include a special character (!@#$...)</li>
                    <li id="uppercase">Include an uppercase letter (A-Z)</li>
                </ul>
            </div>
            <button type="submit" value="Submit">Submit</button>
        </form>
        <script>
            const passwordInput = document.getElementById("password");
            const passwordRules = document.getElementById("password-rules");
            const form = document.querySelector("form");
            const lengthRule = document.getElementById("length");
            const specialRule = document.getElementById("special");
            const uppercaseRule = document.getElementById("uppercase");

            form.addEventListener("submit", function() {
                event.preventDefault();
                window.location.href = "success.html";
            });

            passwordInput.addEventListener("input", function() {
                event.preventDefault();
                const password = passwordInput.value;
                passwordRules.hidden = false;

                const lengthValid = password.length >= 6;
                const specialValid = /[!@#$%^&*(),.?":{}|<>]/.test(password);
                const uppercaseValid = /[A-Z]/.test(password);

                lengthRule.classList.toggle("valid", lengthValid);
                lengthRule.classList.toggle("invalid", !lengthValid);

                specialRule.classList.toggle("valid", specialValid);
                specialRule.classList.toggle("invalid", !specialValid);

                uppercaseRule.classList.toggle("valid", uppercaseValid);
                uppercaseRule.classList.toggle("invalid", !uppercaseValid);
            });
        </script>

    </body>
</html>
