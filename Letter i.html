<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>letter I</title>
<style>
.i{background-color: black;
display: inline-block;
}
.e{background-color: grey;
display: inline-block;
border-radius: 10px;
}
.il,.ir{
    background-color: white;
    display: inline-block;
    width:20px;
    height: 50px;
    
    
}
.il{
    margin: 12px 5px 10px 0;
}
.ir{ margin: 12px 0  10px  5px;

}
.el,.er{
    background-color: black;
    display: inline-block;
    width:40px;
    height: 50px;
    
    
}
.el{
    margin: 15px 0 15px 15px;
    border-radius: 7px 0 0 7px;
}

</style>
</head>
<body>
<div class="i">
    <div class="il"></div>
    <div class="ir"></div>
</div>
<div class="e">
    <div class="el"></div>
    
</div>
</body>
</html>
